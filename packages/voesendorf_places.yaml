# Vösendorf: Standorte der Zusatzservices (ASZ, Blumenerde-Aktion, Müllinseln,
# Grünschnittcontainer) für die Karte im Dashboard.
#
# Erzeugt von tools/fetch_places.py - nicht von Hand bearbeiten.
#
# Einbinden über configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Die Sensoren haben nur eine Aufgabe: sie tragen latitude/longitude als
# Attribute, damit die eingebaute Kartenkarte (type: map) sie als Marker zeigt.
template:
  - sensor:
      # Altstoffsammelzentrum
      - name: "Altstoffsammelzentrum (ASZ)"
        unique_id: voesendorf_place_asz
        icon: mdi:recycle
        state: "Gemeindegebiet"
        attributes:
          latitude: 48.12099
          longitude: 16.348562
          art: "Altstoffsammelzentrum"
          bereich: "Gemeindegebiet"
          hinweis: "Johannisweg 1 (Wirtschaftshof) - Mo-Do 10-15, Fr 10-12, Sa 8-12 Uhr"
          quelle: "nominatim:Johannisweg 1, 2331 Vösendorf, Austria (Johannisweg)"
      # Blumenerde-Aktion – Oberort
      - name: "Blumenerde: Benyasiedlung"
        unique_id: voesendorf_place_blumenerde_benyasiedlung
        icon: mdi:flower
        state: "Oberort"
        attributes:
          latitude: 48.115385
          longitude: 16.312724
          art: "Blumenerde-Aktion"
          bereich: "Oberort"
          hinweis: "Blumenerde-Aktion: 11.04. und 09.05., Ersatz 18.04. und 16.05., 10-13 Uhr"
          quelle: "streets.geojson:Benyasiedlung"
      # Blumenerde-Aktion
